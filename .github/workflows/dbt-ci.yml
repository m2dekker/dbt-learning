name: dbt CI

# Run on every pull request, and on main after a merge
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the run that is still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

jobs:
  lint:
    name: Lint (pre-commit + SQLFluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pre-commit hooks on all files
        run: pre-commit run --all-files --show-diff-on-failure

  build:
    name: dbt build (seeds, models, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt
        run: pip install -r requirements.txt

      # profiles.yml lives in the repo, so the runner gets a working profile for free;
      # the DuckDB file is created fresh on this throwaway machine.
      - name: Check connection
        run: dbt debug

      - name: Install dbt packages
        run: dbt deps

      - name: Build and test everything
        run: dbt build

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: |
            target/manifest.json
            target/run_results.json
            logs/dbt.log
